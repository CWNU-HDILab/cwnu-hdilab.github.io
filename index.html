<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HDI Lab · Human Data Intelligence Lab, Changwon National University</title>
<meta name="description" content="국립창원대학교 인공지능공학과 인간 데이터 지능 연구실(Human Data Intelligence Lab)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* =========================================================
   HDI Lab design system
   Color   paper / paper-2 / ink / ink-2 / muted / rule / accent
   Type    Archivo (variable width) for Latin display + text,
           Pretendard (if installed) → IBM Plex Sans KR for Hangul
   Scale   12 · 13.5 · 15 · 17 · 20 · 24 · 32 · 44 · 60 · display
   Space   4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96 · 128 · 176
   Grid    12 columns, max 1440px, margin clamp(20,4vw,56), gutter clamp(16,2vw,28)
   ========================================================= */
:root{
  --paper:#F7F6F2; --paper-2:#EEEDE7; --ink:#1B1C1F; --ink-2:#3E4147; --muted:#64676E;
  --rule:#D5D3CB; --rule-ink:#1B1C1F; --accent:#1E3E8C; --accent-soft:rgba(30,62,140,.10);
  --band:#1B1C1F; --band-ink:#F1F0EB; --band-muted:#A4A6AC; --band-rule:#3A3C42; --band-accent:#A9BDF2;
  --f:"Archivo","Pretendard Variable","Pretendard","IBM Plex Sans KR",system-ui,sans-serif;
  --m:clamp(20px,4vw,56px); --g:clamp(16px,2vw,28px); --max:1440px;
  --hdr:64px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131416; --paper-2:#1B1D20; --ink:#ECEBE6; --ink-2:#C9CACD; --muted:#9B9EA5;
    --rule:#2D3035; --rule-ink:#ECEBE6; --accent:#9DB4F0; --accent-soft:rgba(157,180,240,.12);
    --band:#1E2024; --band-ink:#ECEBE6; --band-muted:#9B9EA5; --band-rule:#34373D; --band-accent:#9DB4F0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131416; --paper-2:#1B1D20; --ink:#ECEBE6; --ink-2:#C9CACD; --muted:#9B9EA5;
  --rule:#2D3035; --rule-ink:#ECEBE6; --accent:#9DB4F0; --accent-soft:rgba(157,180,240,.12);
  --band:#1E2024; --band-ink:#ECEBE6; --band-muted:#9B9EA5; --band-rule:#34373D; --band-accent:#9DB4F0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 24px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f);font-size:17px;line-height:1.72;font-weight:400;
  word-break:keep-all;overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
::selection{background:var(--accent-soft)}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.22em;text-decoration-color:var(--rule)}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:1px}
h1,h2,h3,h4,p,dl,dd,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{max-width:100%}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:var(--max);margin-inline:auto;padding-inline:var(--m)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g)}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:1px solid var(--rule)}
.hdr .wrap{height:var(--hdr);display:flex;align-items:center;justify-content:space-between;gap:24px}
.mark{display:flex;align-items:baseline;gap:14px;text-decoration:none}
.mark b{font-weight:750;font-stretch:88%;font-size:20px;letter-spacing:-.01em}
.mark span{font-size:13.5px;color:var(--muted);letter-spacing:.005em}
.nav{display:flex;gap:28px}
.nav a{font-size:15px;text-decoration:none;color:var(--ink-2);padding:8px 0;position:relative}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1.5px;background:var(--accent)}
.menu-btn{display:none;font-size:15px;padding:10px 0;min-height:44px}
@media (max-width:900px){
  .mark span{display:none}
  .menu-btn{display:block}
  .nav{display:none;position:fixed;inset:calc(env(safe-area-inset-top,0px) + var(--hdr)) 0 0;background:var(--paper);flex-direction:column;gap:0;padding:16px var(--m) calc(32px + env(safe-area-inset-bottom,0px));overflow:auto}
  .nav.open{display:flex}
  .nav a{font-size:34px;font-weight:600;font-stretch:80%;color:var(--ink);padding:10px 0;border-bottom:1px solid var(--rule);letter-spacing:-.01em}
  .nav a[aria-current="page"]{color:var(--accent)}
  .nav a[aria-current="page"]::after{display:none}
}

/* ---------- shared type ---------- */
.display{font-weight:800;font-stretch:70%;letter-spacing:-.025em;line-height:.88}
.h2{font-size:clamp(34px,4vw,58px);font-weight:620;font-stretch:78%;letter-spacing:-.02em;line-height:1}
.ko-sub{font-size:15px;color:var(--muted);line-height:1.5}
.small{font-size:13.5px;line-height:1.55}
.muted{color:var(--muted)}
.lede{font-size:clamp(19px,1.6vw,22px);line-height:1.62;color:var(--ink-2);max-width:36em}
.rule-strong{border:0;border-top:1.5px solid var(--rule-ink);margin:0}
.more{font-size:15px;font-weight:500;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:.3em}
.more:hover{text-decoration-color:var(--ink)}

/* section heads: one consistent device (title + Korean sub), placed differently per section */
.shead{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);align-items:end;margin-bottom:clamp(32px,4vw,56px)}
.shead .h2{grid-column:1/7}
.shead .ko-sub{grid-column:7/11}
.shead .more{grid-column:11/13;justify-self:end}

/* ---------- hero ---------- */
.hero{padding-top:clamp(28px,4.5vw,72px)}
.hero-title{margin:0;font-size:15.5vw}
.hero-title .ln{display:block;overflow:hidden;padding-bottom:.01em}
.hero-title .in{display:inline-block;white-space:nowrap}
.hero-title .l2{padding-left:calc((100% + var(--g)) / 12 * 6)}
.animate .hero-title .in{transform:translateY(102%);animation:rise 1s cubic-bezier(.16,.84,.24,1) forwards}
.animate .hero-title .l2 .in{animation-delay:.09s}
.animate .hero-title .l3 .in{animation-delay:.18s}
.animate .hero-foot{opacity:0;animation:fade .8s .55s ease forwards}
@keyframes rise{to{transform:none}}
@keyframes fade{to{opacity:1}}
.hero-foot{padding-top:clamp(28px,3.5vw,48px);padding-bottom:clamp(64px,8vw,128px);row-gap:28px}
.hero-id{grid-column:1/5;font-size:14px;line-height:1.6;color:var(--muted)}
.hero-id b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.hero-lede{grid-column:7/13}
.hero-lede p:first-child{font-size:clamp(19px,1.7vw,23px);line-height:1.62;color:var(--ink)}
.hero-lede p+p{margin-top:16px;font-size:15px;color:var(--muted);line-height:1.6;max-width:34em}

/* ---------- about ---------- */
.about{padding-block:clamp(72px,9vw,136px)}
.about .label{grid-column:1/4;font-size:15px;color:var(--muted);padding-top:.5em}
.about-text{grid-column:4/12;font-size:clamp(22px,2.15vw,31px);line-height:1.55;letter-spacing:-.008em;font-weight:400;text-wrap:pretty}
.facts{grid-column:4/12;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--g);margin-top:clamp(40px,5vw,64px);padding-top:20px;border-top:1px solid var(--rule)}
.facts dt{font-size:13.5px;color:var(--muted);margin-bottom:4px}
.facts dd{font-size:16px;line-height:1.55}

/* ---------- research area index ---------- */
.areas{padding-bottom:clamp(80px,10vw,144px)}
.area-row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);padding:clamp(24px,2.8vw,36px) 0;border-top:1px solid var(--rule);text-decoration:none;align-items:start}
.area-row:last-child{border-bottom:1px solid var(--rule)}
.area-row .nm{grid-column:1/7}
.area-row .nm b{display:block;font-size:clamp(30px,3.4vw,50px);font-weight:640;font-stretch:76%;letter-spacing:-.018em;line-height:1.02;transition:color .2s}
.area-row .nm span{display:block;margin-top:8px;font-size:15px;color:var(--muted)}
.area-row .ds{grid-column:7/11;font-size:15.5px;line-height:1.7;color:var(--ink-2)}
.area-row .ct{grid-column:11/13;justify-self:end;text-align:right}
.area-row .ct b{display:block;font-size:clamp(30px,3vw,44px);font-weight:600;font-stretch:80%;line-height:1;font-variant-numeric:tabular-nums}
.area-row .ct span{font-size:13.5px;color:var(--muted)}
.area-row:hover .nm b{color:var(--accent)}

/* ---------- selected research (alternate surface) ---------- */
.band-2{background:var(--paper-2)}
.selected{padding-block:clamp(80px,10vw,144px)}
.feat{grid-column:1/8}
.feat .meta,.side .meta{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:16px}
.award{color:var(--accent);font-weight:600}
.feat h3{font-size:clamp(28px,3vw,44px);font-weight:520;font-stretch:90%;line-height:1.13;letter-spacing:-.015em;text-wrap:balance}
.feat h3 a,.side h3 a{text-decoration:none}
.feat h3 a:hover,.side h3 a:hover{text-decoration:underline;text-decoration-thickness:1px}
.feat .by{margin-top:24px;font-size:15px;color:var(--ink-2)}
.feat .vn{font-size:15px;color:var(--muted);font-style:italic}
.feat .why{margin-top:28px;max-width:34em;font-size:16px;color:var(--ink-2);padding-top:20px;border-top:1px solid var(--rule)}
.side{grid-column:9/13;display:flex;flex-direction:column}
.side article{padding-bottom:28px}
.side article+article{padding-top:28px;border-top:1px solid var(--rule)}
.side h3{font-size:19px;font-weight:540;line-height:1.35;letter-spacing:-.005em}
.side .by{margin-top:10px;font-size:14px;color:var(--ink-2)}
.side .vn{font-size:14px;color:var(--muted);font-style:italic}

/* ---------- publication list (shared) ---------- */
.yr-group{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);border-top:1.5px solid var(--rule-ink);padding-top:18px;margin-bottom:clamp(40px,5vw,64px)}
.yr-group>.yr{grid-column:1/3;font-size:clamp(40px,4.4vw,64px);font-weight:760;font-stretch:72%;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.yr-group>.yr small{display:block;margin-top:10px;font-size:13.5px;font-weight:400;font-stretch:100%;letter-spacing:0;color:var(--muted)}
.yr-group>ol{grid-column:3/13}
.pub{display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:6px 32px;padding:18px 0 20px}
.pub+.pub{border-top:1px solid var(--rule)}
.pub h3{font-size:17.5px;font-weight:560;line-height:1.42;letter-spacing:-.004em;text-wrap:pretty}
.pub h3 a{text-decoration:none}
.pub h3 a:hover{text-decoration:underline}
.pub .au{font-size:14.5px;color:var(--ink-2);margin-top:6px;line-height:1.55}
.pub .vn{font-size:14.5px;color:var(--muted);line-height:1.55}
.pub .vn i{font-style:italic}
.pub .side-meta{font-size:13px;line-height:1.5;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.idx{font-weight:650;letter-spacing:.02em;font-size:12.5px}
.idx.scie{color:var(--accent)}
.pub .side-meta a{color:var(--muted)}
.au b{font-weight:650;color:var(--ink)}
.au .lab{text-decoration:underline;text-decoration-color:var(--muted);text-decoration-style:dotted;text-underline-offset:.25em}
mark{background:var(--accent-soft);color:inherit;padding:0 1px}
.compact .pub h3{font-size:16.5px}

/* ---------- news ledger (home) ---------- */
.news-home{padding-block:clamp(80px,10vw,136px)}
.ledger{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:var(--g);border-top:1.5px solid var(--rule-ink)}
.ledger article{padding-top:20px;padding-right:8px}
.ledger time{display:block;font-size:clamp(26px,2.4vw,34px);font-weight:620;font-stretch:78%;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ledger .cat{display:block;margin-top:12px;font-size:13.5px;color:var(--accent);font-weight:550}
.ledger p{margin-top:8px;font-size:15px;line-height:1.65;color:var(--ink-2)}

/* ---------- gantt ---------- */
.funded{padding-bottom:clamp(80px,10vw,136px)}
.gantt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gantt{min-width:760px;display:grid;grid-template-columns:minmax(220px,28%) 1fr;column-gap:var(--g)}
.g-labels>div,.g-row{height:64px}
.g-labels>div{display:flex;flex-direction:column;justify-content:center;border-top:1px solid var(--rule)}
.g-labels b{font-size:15px;font-weight:560;line-height:1.35}
.g-labels span{font-size:13px;color:var(--muted)}
.g-plot{position:relative}
.g-row{position:relative;border-top:1px solid var(--rule)}
.g-bar{position:absolute;top:50%;height:8px;margin-top:-4px}
.g-bar.on{background:var(--accent)}
.g-bar.done{background:var(--muted)}
.g-bar.soon{background:transparent;box-shadow:inset 0 0 0 1px var(--ink);background-image:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 6px)}
.g-axis{position:relative;height:36px;border-top:1.5px solid var(--rule-ink)}
.g-axis span{position:absolute;top:8px;font-size:12.5px;color:var(--muted);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.g-axis span:first-child{transform:none}
.g-today{position:absolute;top:0;bottom:36px;width:0;border-left:1px solid var(--ink)}
.g-today span{position:absolute;top:-22px;left:6px;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.g-labels .g-axis-spacer{height:36px;border-top:1.5px solid var(--rule-ink)}
.g-legend{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:20px;font-size:13.5px;color:var(--muted)}
.g-legend i{display:inline-block;width:22px;height:8px;margin-right:8px;vertical-align:middle}

/* ---------- contact band ---------- */
.band{background:var(--band);color:var(--band-ink)}
.band a{text-decoration-color:var(--band-rule)}
.band a:hover{text-decoration-color:var(--band-ink)}
.contact-band{padding-block:clamp(88px,11vw,168px)}
.contact-band .label{grid-column:1/13;font-size:15px;color:var(--band-muted);margin-bottom:20px}
.contact-band .mail{grid-column:1/13;font-size:clamp(34px,7.2vw,112px);font-weight:700;font-stretch:72%;letter-spacing:-.025em;line-height:.95;text-decoration:none;justify-self:start;overflow-wrap:anywhere}
.contact-band .mail:hover{color:var(--band-accent)}
.contact-band .cols{grid-column:1/13;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--g);margin-top:clamp(48px,6vw,88px);padding-top:20px;border-top:1px solid var(--band-rule)}
.contact-band .cols>div{grid-column:span 4;font-size:15px;line-height:1.7}
.contact-band .cols h3{font-size:13.5px;font-weight:400;color:var(--band-muted);margin-bottom:6px}

/* ---------- page head ---------- */
.phead{padding-top:clamp(40px,6vw,96px);padding-bottom:clamp(48px,6vw,88px);align-items:end;row-gap:24px}
.phead h1{grid-column:1/13;font-size:clamp(72px,14vw,220px)}
.phead .ph-ko{grid-column:1/5;font-size:15px;color:var(--muted)}
.phead .lede{grid-column:7/13}

/* ---------- research page ---------- */
.rs{padding-block:clamp(56px,7vw,104px);border-top:1.5px solid var(--rule-ink)}
.rs-aside{grid-column:1/5;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 32px)}
.rs-aside h2{font-size:clamp(36px,3.8vw,56px);font-weight:660;font-stretch:74%;letter-spacing:-.02em;line-height:1}
.rs-aside .ko-sub{margin-top:12px}
.rs-aside dl{margin-top:32px;display:grid;grid-template-columns:auto 1fr;gap:6px 20px;font-size:14px}
.rs-aside dt{color:var(--muted)}
.rs-aside dd{font-variant-numeric:tabular-nums}
.rs-body{grid-column:6/13}
.rs-body>p{font-size:clamp(18px,1.5vw,21px);line-height:1.7;max-width:36em}
.kw{margin-top:24px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14.5px;color:var(--ink-2)}
.kw li{position:relative}
.rs-body h3{margin-top:56px;font-size:15px;font-weight:600;padding-bottom:10px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:16px}
.rs-body h3 a{font-weight:400;color:var(--muted);font-size:14px}
.rs-body .pub{grid-template-columns:56px minmax(0,1fr) 132px}
.rs-body .pub .y{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.rs-proj li{padding:14px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px}
.rs-proj b{font-weight:550;font-size:16px}
.rs-proj span{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- publications page ---------- */
.pubs-page{padding-bottom:clamp(80px,10vw,144px)}
.filters{grid-column:1/4;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 24px);max-height:calc(100vh - var(--hdr) - 48px);overflow:auto;padding-right:8px;padding-bottom:24px}
.results{grid-column:4/13}
.search{display:block;margin-bottom:32px}
.search span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:6px}
.search input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--rule-ink);padding:8px 0;border-radius:0;outline:none}
.search input:focus-visible{border-bottom-color:var(--accent);outline:none;box-shadow:0 1.5px 0 0 var(--accent)}
.search input::placeholder{color:var(--muted)}
.fgroup{margin-bottom:28px}
.fgroup h2{font-size:13.5px;font-weight:400;color:var(--muted);margin-bottom:6px}
.fgroup ul{display:flex;flex-direction:column}
.fbtn{display:flex;justify-content:space-between;align-items:baseline;width:100%;text-align:left;font-size:15px;padding:5px 0;min-height:34px;color:var(--ink-2)}
.fbtn em{font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.fbtn:hover{color:var(--ink)}
.fbtn[aria-pressed="true"]{color:var(--ink);font-weight:620}
.fbtn[aria-pressed="true"] span{box-shadow:inset 0 -1.5px 0 var(--accent)}
.fbtn[disabled]{opacity:.38;cursor:default}
.legend{font-size:13px;color:var(--muted);line-height:1.6;padding-top:16px;border-top:1px solid var(--rule)}
.legend b{color:var(--ink);font-weight:650}
.legend .lab{text-decoration:underline dotted;text-underline-offset:.25em}
.resbar{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:28px;font-size:14.5px;color:var(--muted)}
.resbar button{text-decoration:underline;text-underline-offset:.25em;text-decoration-color:var(--rule);min-height:32px}
.resbar button:hover{color:var(--ink);text-decoration-color:var(--ink)}
.results .yr-group{grid-template-columns:repeat(9,minmax(0,1fr))}
.results .yr-group>.yr{grid-column:1/3}
.results .yr-group>ol{grid-column:3/10}
.empty{padding:48px 0;border-top:1.5px solid var(--rule-ink);font-size:17px}
.empty p+p{margin-top:8px;font-size:15px;color:var(--muted)}

/* ---------- projects page ---------- */

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const fmt = d => d ? d.split("-").join(".") : "";
const TODAY = new Date();
const PI_NAMES = ["Jung-In Choi","최정인"];
const LAB_NAMES = ["Sohee Myeong","명소희","Yeeun Jang","장예은","Junmin Kang","강준민","Yeon-Du Seo","서연두","Chae-Min Lee","이채민","A-Jeong Jo","조아정"];
const TYPE_LABEL = {journal:"학술지", conference:"학술대회", book:"저서"};
const IDX_LABEL = {SCIE:"SCIE", Scopus:"Scopus", KCI:"KCI", International:"국제", Domestic:"국내", Book:"저서"};

function authorsHTML(str){
  let h = esc(str);
  PI_NAMES.forEach(n => { h = h.replace(new RegExp(reEsc(n),"g"), `<b>${n}</b>`); });
  LAB_NAMES.forEach(n => { h = h.replace(new RegExp(reEsc(n),"g"), `<span class="lab">${n}</span>`); });
  return h;
}
function hl(text, q){
  const t = esc(text);
  if(!q) return t;
  return t.replace(new RegExp(reEsc(esc(q)),"gi"), m => `<mark>${m}</mark>`);
}
const linkOf = p => p.doi ? "https://doi.org/" + p.doi.replace(/\(/g,"%28").replace(/\)/g,"%29") : (p.url || "");
function newsImg(n, max){
  const list = (n.images && n.images.length ? n.images : (n.image ? [{src:n.image, alt:n.alt, caption:n.caption}] : [])).slice(0, max || 99);
  if(!list.length) return "";
  const fig = im => `<figure class="nimg"><img src="${esc(im.src)}" alt="${esc(im.alt||"")}" loading="lazy" onerror="this.parentNode.style.display='none'">${im.caption?`<figcaption>${esc(im.caption)}</figcaption>`:""}</figure>`;
  if(list.length === 1) return fig(list[0]);
  return `<div class="ngal${list.length % 2 ? " odd" : ""}">${list.map(fig).join("")}</div>`;
}
const photoOf = (src, alt) => src ? `<img class="ph" src="${esc(src)}" alt="${esc(alt)}" loading="lazy" onerror="this.remove()">` : "";
const byId = id => PUBS.find(p => p.id === id);
function sortPubs(list){
  return [...list].sort((a,b) => (b.year - a.year) || ((b.date||"") > (a.date||"") ? 1 : (b.date||"") < (a.date||"") ? -1 : 0) || (a.type === "journal" ? -1 : 1));
}
function parseD(s, end){
  const [y,m,d] = s.split("-").map(Number);
  if(d) return new Date(y, m-1, d);
  return end ? new Date(y, m, 0) : new Date(y, m-1, 1);
}
function status(p){
  const s = parseD(p.start), e = parseD(p.end, true);
  if(TODAY < s) return {k:"soon", t:"착수 예정"};
  if(TODAY <= e) return {k:"on", t:"진행 중"};
  return {k:"done", t:"종료"};
}
function counts(area){
  const l = PUBS.filter(p => p.area === area);
  return {all:l.length, j:l.filter(p=>p.type==="journal").length, c:l.filter(p=>p.type==="conference").length, b:l.filter(p=>p.type==="book").length};
}

function pubItem(p, q, opts={}){
  const link = linkOf(p);
  const title = hl(p.title, q);
  const t = link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${title}</a>` : title;
  const venue = `<i>${hl(p.venue,q)}</i>${p.detail ? ", " + esc(p.detail) : ""}${p.date && p.type==="conference" ? ", " + fmt(p.date) : ""}`;
  const idxCls = p.index === "SCIE" ? "idx scie" : "idx";
  return `<li class="pub">
    ${opts.year ? `<span class="y">${p.year}</span>` : ""}
    <div>
      <h3>${t}</h3>
      <p class="au">${authorsHTML(p.authors)}</p>
      <p class="vn">${venue}</p>
    </div>
    <div class="side-meta">
      <span class="${idxCls}">${IDX_LABEL[p.index]}</span>
      ${p.award ? `<span class="award">${esc(p.award)}</span>` : ""}
      ${p.doi ? `<a href="${esc(link)}" target="_blank" rel="noopener">DOI</a>` : (link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${p.type==="book" ? "도서 정보" : "원문"}</a>` : "")}
    </div>
  </li>`;
}
function yearGroups(list, q, cls=""){
  const years = [...new Set(list.map(p => p.year))].sort((a,b)=>b-a);
  return years.map(y => {
    const items = list.filter(p => p.year === y);
    return `<section class="yr-group ${cls}" aria-label="${y}년">
      <div class="yr">${y}<small>${items.length}편</small></div>
      <ol>${items.map(p => pubItem(p, q)).join("")}</ol>
    </section>`;
  }).join("");
}

function gantt(){
  const min = new Date(2018,0,1), max = new Date(2036,0,1), span = max - min;
  const pct = d => Math.max(0, Math.min(100, (d - min) / span * 100));
  const rows = [...PROJECTS].sort((a,b) => parseD(b.start) - parseD(a.start));
  const ticks = []; for(let y=2018; y<=2036; y+=2) ticks.push(y);
  const today = pct(TODAY);
  const ty = `${TODAY.getFullYear()}.${String(TODAY.getMonth()+1).padStart(2,"0")}`;
  return `<div class="gantt-scroll" role="img" aria-label="연구과제 기간 타임라인, 2018년부터 2035년까지">
    <div class="gantt">
      <div class="g-labels">
        ${rows.map(p => `<div><b>${esc(p.short)}</b><span>${esc(p.agency)}, ${fmt(p.start)} – ${fmt(p.end)}</span></div>`).join("")}
        <div class="g-axis-spacer"></div>
      </div>
      <div class="g-plot">
        ${rows.map(p => { const s = status(p); const a = pct(parseD(p.start)), b = pct(parseD(p.end,true));
          return `<div class="g-row"><span class="g-bar ${s.k}" style="left:${a}%;width:${Math.max(.6,b-a)}%" title="${esc(s.t)}"></span></div>`; }).join("")}
        <div class="g-axis">${ticks.map(y => `<span style="left:${pct(new Date(y,0,1))}%">${y}</span>`).join("")}</div>
        <div class="g-today" style="left:${today}%"><span>${ty}</span></div>
      </div>
    </div>
  </div>
  <div class="g-legend">
    <span><i style="background:var(--accent)"></i>진행 중</span>
    <span><i style="box-shadow:inset 0 0 0 1px var(--ink);background-image:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 6px)"></i>착수 예정</span>
    <span><i style="background:var(--muted)"></i>종료</span>
  </div>`;
}

const PS = {q:"", type:"all", idx:"all", area:"all", year:"all"};
function pubFilter(st, skip){
  const q = st.q.trim().toLowerCase();
  return PUBS.filter(p =>
    (skip==="type" || st.type==="all" || p.type===st.type) &&
    (skip==="idx"  || st.idx==="all"  || p.index===st.idx) &&
    (skip==="area" || st.area==="all" || p.area===st.area) &&
    (skip==="year" || st.year==="all" || String(p.year)===st.year) &&
    (!q || [p.title,p.authors,p.venue,String(p.year),p.detail||"",p.award||""].join(" ").toLowerCase().includes(q))
  );
}
function fgroup(name, key, opts){
  const base = pubFilter(PS, key);
  return `<div class="fgroup"><h2>${name}</h2><ul>${opts.map(([v,label]) => {
    const n = v==="all" ? base.length : base.filter(p => String(key==="type"?p.type:key==="idx"?p.index:key==="area"?p.area:p.year)===v).length;
    return `<li><button class="fbtn" data-k="${key}" data-v="${v}" aria-pressed="${PS[key]===v}" ${n===0&&PS[key]!==v?"disabled":""}><span>${esc(label)}</span><em>${n}</em></button></li>`;
  }).join("")}</ul></div>`;
}
function renderFilters(){
  const years = [...new Set(PUBS.map(p=>p.year))].sort((a,b)=>b-a);
  document.getElementById("fgroups").innerHTML =
    fgroup("유형","type",[["all","전체"],["journal","학술지"],["conference","학술대회"],["book","저서"]]) +
    fgroup("등재 구분","idx",[["all","전체"],["SCIE","SCIE"],["Scopus","Scopus"],["KCI","KCI"],["International","국제 학술대회"],["Domestic","국내 학술대회"]]) +
    fgroup("연구 분야","area",[["all","전체"],...AREA_ORDER.map(k=>[k,AREAS[k].en])]) +
    fgroup("연도","year",[["all","전체"],...years.map(y=>[String(y),String(y)])]);
}
function renderResults(){
  const list = sortPubs(pubFilter(PS));
  const active = PS.q || PS.type!=="all" || PS.idx!=="all" || PS.area!=="all" || PS.year!=="all";
  document.getElementById("resbar").innerHTML = `<span aria-live="polite">${active ? `${PUBS.length}편 중 <b style="color:var(--ink);font-weight:600">${list.length}편</b>` : `전체 ${PUBS.length}편`}</span>${active?`<button id="reset">조건 초기화</button>`:""}`;
  document.getElementById("reslist").innerHTML = list.length ? yearGroups(list, PS.q.trim()) :
    `<div class="empty"><p>조건에 맞는 논문이 없습니다.</p><p>검색어를 줄이거나 필터를 해제해 보세요.</p></div>`;
  renderFilters();
}

function curTerm(){ const y = TODAY.getFullYear(), m = TODAY.getMonth()+1; if(m>=3 && m<=8) return `${y}-1`; return m>=9 ? `${y}-2` : `${y-1}-2`; }
function pageTeaching(){

        <li><a href="https://www.google.com/maps/search/?api=1&query=Changwon+National+University" target="_blank" rel="noopener">Google Maps</a></li>

/* =========================================================
   ROUTER
   ========================================================= */
const main = document.getElementById("main");
let first = true;
function fitHero(){
  const t = document.querySelector(".hero-title"); if(!t) return;
  const ref = t.querySelector(".l3 .in");
  t.style.fontSize = "100px";
  const w = ref.getBoundingClientRect().width;
  const avail = t.getBoundingClientRect().width;
  if(w > 0) t.style.fontSize = Math.floor(100 * avail / w * 0.995 * 100) / 100 + "px";
}
function route(){
  const raw = decodeURIComponent(location.hash.slice(1)) || "/";
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean);
  const page = parts[0] || "home";
  const params = new URLSearchParams(qs || "");
  const pages = {home:pageHome, research:pageResearch, publications:()=>pagePublications(params), projects:pageProjects, people:pagePeople, teaching:pageTeaching, news:pageNews, contact:pageContact};
  const fn = pages[page] || pageHome;
  main.innerHTML = fn();
  main.classList.remove("enter","animate");
  void main.offsetWidth;
  if(page==="home" && first) main.classList.add("animate"); else if(!first) main.classList.add("enter");
  if(page==="publications") bindPublications();
  if(page==="news") bindNews();
  if(page==="home"){ fitHero(); if(document.fonts) document.fonts.ready.then(fitHero); }
  document.querySelectorAll(".nav a").forEach(a => a.toggleAttribute("aria-current", a.dataset.p === page) || a.removeAttribute("aria-current"));
  document.querySelectorAll(".nav a").forEach(a => { if(a.dataset.p === page) a.setAttribute("aria-current","page"); });
  const titles = {home:"", research:"Research", publications:"Publications", projects:"Projects", people:"People", teaching:"Teaching", news:"News", contact:"Contact"};
  document.title = (titles[page] ? titles[page] + " | " : "") + "HDI Lab, Changwon National University";
  closeMenu();
  if(parts[1]){ const el = document.getElementById("area-" + parts[1]); if(el){ requestAnimationFrame(()=>el.scrollIntoView()); first=false; return; } }
  if(!first){ window.scrollTo(0,0); main.focus({preventScroll:true}); }
  first = false;
}
const btn = document.querySelector(".menu-btn"), nav = document.getElementById("nav");
function closeMenu(){ nav.classList.remove("open"); btn.setAttribute("aria-expanded","false"); btn.textContent = "메뉴"; document.body.style.overflow = ""; }
btn.addEventListener("click", () => { const o = !nav.classList.contains("open"); nav.classList.toggle("open", o); btn.setAttribute("aria-expanded", String(o)); btn.textContent = o ? "닫기" : "메뉴"; document.body.style.overflow = o ? "hidden" : ""; });
document.addEventListener("keydown", e => { if(e.key === "Escape" && nav.classList.contains("open")){ closeMenu(); btn.focus(); } });
let rt; window.addEventListener("resize", () => { cancelAnimationFrame(rt); rt = requestAnimationFrame(fitHero); });
window.addEventListener("hashchange", route);
route();
</script>
